<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CODIGO PRUEBA</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background-color: transparent;
      color: #333;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      overflow: hidden;
      padding: 1rem;
    }

    h1 {
      font-size: 1.2rem;
      font-weight: 600;
      margin-bottom: 1rem;
      letter-spacing: 1px;
      text-transform: uppercase;
    }

    .countdown-container {
      display: flex;
      gap: 1rem;
      text-align: center;
    }

    .time-block {
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    .number {
      font-size: 2.2rem;
      font-weight: 700;
      background: rgba(0, 0, 0, 0.05);
      padding: 0.5rem 0.8rem;
      border-radius: 8px;
      min-width: 60px;
    }

    .label {
      font-size: 0.7rem;
      text-transform: uppercase;
      letter-spacing: 1px;
      margin-top: 0.4rem;
      opacity: 0.7;
    }

    @media (prefers-color-scheme: dark) {
      body {
        color: #f4f4f4;
      }
      .number {
        background: rgba(255, 255, 255, 0.1);
      }
    }
  </style>
</head>
<body>

  <h1>CODIGO PRUEBA</h1>

  <div class="countdown-container">
    <div class="time-block">
      <span class="number" id="days">00</span>
      <span class="label">Días</span>
    </div>
    <div class="time-block">
      <span class="number" id="hours">00</span>
      <span class="label">Hs</span>
    </div>
    <div class="time-block">
      <span class="number" id="minutes">00</span>
      <span class="label">Min</span>
    </div>
    <div class="time-block">
      <span class="number" id="seconds">00</span>
      <span class="label">Seg</span>
    </div>
  </div>

  <script>
    // Fecha objetivo: 7 de agosto de 2026, 01:00:00
    const targetDate = new Date(2026, 7, 7, 1, 0, 0).getTime();

    function updateCountdown() {
      const now = new Date().getTime();
      const difference = targetDate - now;

      if (difference < 0) {
        document.querySelector('.countdown-container').innerHTML = "<h2>¡Tiempo cumplido!</h2>";
        return;
      }

      const days = Math.floor(difference / (1000 * 60 * 60 * 24));
      const hours = Math.floor((difference % (1000 * 60 * 60 * 24)) / (1000 * 60 * 60));
      const minutes = Math.floor((difference % (1000 * 60 * 60)) / (1000 * 60));
      const seconds = Math.floor((difference % (1000 * 60)) / 1000);

      document.getElementById('days').innerText = String(days).padStart(2, '0');
      document.getElementById('hours').innerText = String(hours).padStart(2, '0');
      document.getElementById('minutes').innerText = String(minutes).padStart(2, '0');
      document.getElementById('seconds').innerText = String(seconds).padStart(2, '0');
    }

    updateCountdown();
    setInterval(updateCountdown, 1000);
  </script>

</body>
</html>
