<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CODIGO PRUEBA</title>
  <style>
    /* Forzado estricto de colores globales */
    html, body {
      background-color: #ffffff !important;
      color: #000000 !important;
      margin: 0;
      padding: 0;
      height: 100vh;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif;
    }

    h1 {
      color: #000000 !important;
      font-size: 1.1rem;
      font-weight: 800;
      letter-spacing: 1.5px;
      margin-bottom: 1.5rem;
      text-transform: uppercase;
    }

    .countdown {
      display: flex;
      gap: 1.8rem;
      text-align: center;
    }

    .unit {
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    .num {
      color: #000000 !important;
      font-size: 2.2rem;
      font-weight: 800;
      line-height: 1;
    }

    .lbl {
      color: #555555 !important;
      font-size: 0.7rem;
      font-weight: 700;
      text-transform: uppercase;
      margin-top: 0.5rem;
      letter-spacing: 1px;
    }
  </style>
</head>
<body>

  <h1>CODIGO PRUEBA</h1>

  <div class="countdown">
    <div class="unit">
      <span class="num" id="days">00</span>
      <span class="lbl">Días</span>
    </div>
    <div class="unit">
      <span class="num" id="hours">00</span>
      <span class="lbl">Hs</span>
    </div>
    <div class="unit">
      <span class="num" id="minutes">00</span>
      <span class="lbl">Min</span>
    </div>
    <div class="unit">
      <span class="num" id="seconds">00</span>
      <span class="lbl">Seg</span>
    </div>
  </div>

  <script>
    const targetDate = new Date(2026, 7, 7, 1, 0, 0).getTime();

    function updateCountdown() {
      const now = new Date().getTime();
      const diff = targetDate - now;

      if (diff <= 0) {
        document.querySelector('.countdown').innerHTML = "<h2 style='color:#000;'>¡Tiempo cumplido!</h2>";
        return;
      }

      const d = Math.floor(diff / (1000 * 60 * 60 * 24));
      const h = Math.floor((diff % (1000 * 60 * 60 * 24)) / (1000 * 60 * 60));
      const m = Math.floor((diff % (1000 * 60 * 60)) / (1000 * 60));
      const s = Math.floor((diff % (1000 * 60)) / 1000);

      document.getElementById('days').textContent = String(d).padStart(2, '0');
      document.getElementById('hours').textContent = String(h).padStart(2, '0');
      document.getElementById('minutes').textContent = String(m).padStart(2, '0');
      document.getElementById('seconds').textContent = String(s).padStart(2, '0');
    }

    updateCountdown();
    setInterval(updateCountdown, 1000);
  </script>

</body>
</html>
